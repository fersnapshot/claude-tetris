<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tetris</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrapper">
      <h1 class="game-title">TETRIS</h1>
      <div class="game-container">
        <canvas id="board" width="300" height="600"></canvas>

        <aside class="panel">
          <div class="panel-section">
            <span class="label">SCORE</span>
            <span class="value" id="score">0</span>
          </div>
          <div class="panel-section">
            <span class="label">LINES</span>
            <span class="value" id="lines">0</span>
          </div>
          <div class="panel-section">
            <span class="label">LEVEL</span>
            <span class="value" id="level">1</span>
          </div>

          <div class="panel-section">
            <span class="label">NEXT</span>
            <canvas id="next-canvas" width="120" height="120"></canvas>
          </div>

          <div class="panel-section controls">
            <span class="label">CONTROLS</span>
            <ul>
              <li><kbd>←</kbd><kbd>→</kbd> mover</li>
              <li><kbd>↑</kbd> rotar</li>
              <li><kbd>↓</kbd> bajar</li>
              <li><kbd>Space</kbd> caída</li>
              <li><kbd>P</kbd> pausa</li>
            </ul>
          </div>

          <div class="panel-section">
            <label class="theme-toggle">
              <input type="checkbox" id="themeToggle">
              <span class="toggle-track">
                <span class="toggle-thumb"></span>
              </span>
              <span class="toggle-label">Luz</span>
            </label>
          </div>
        </aside>
      </div>

      <div id="overlay" class="overlay hidden">
        <div class="overlay-box">
          <p id="overlay-title">GAME OVER</p>
          <p id="overlay-score"></p>
          <p id="overlay-stats"></p>

          <!-- Formulario nombre (solo si entra en top 5) -->
          <div id="name-form" class="hidden">
            <p class="name-prompt">¡Entraste en el top 5! Ingresa tu nombre:</p>
            <div class="name-form-row">
              <input id="player-name" type="text" maxlength="16" placeholder="Nombre" autocomplete="off" />
              <button id="save-btn">Guardar</button>
            </div>
          </div>

          <!-- Tabla de records -->
          <div id="leaderboard">
            <p class="lb-title">RECORDS</p>
            <table id="lb-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Nombre</th>
                  <th>Score</th>
                  <th>Líneas</th>
                  <th>Combo</th>
                </tr>
              </thead>
              <tbody id="lb-body"></tbody>
            </table>
            <button id="reset-records-btn">Borrar records</button>
          </div>

          <button id="restart-btn">Reiniciar</button>
        </div>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
